# The four retro-futures, newest first. Each era is what people of its time imagined
# the ultimate future would be. The time machine reads `charge`, `sign` and `quote`.
# Quotes are drafts (4 Nov 2026): easy to change later, but each keeps its source.
- id: '2099'
  year: 2099
  act: I
  title: The Ethereal Singularity
  dream: Zero friction
  anchor: top
  charge: '#9FE7F5' # iris
- id: '1999'
