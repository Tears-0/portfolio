name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tools for the resume PDF (Chromium, poppler)
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils
      - name: Types and content schemas
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          # The contact portal's Turnstile site key (public). Unset, the build uses Cloudflare's
          # test key, which passes everyone (DEPLOY.md, step 5).
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - name: Checks on the built site (parity, no drafts, no phone number)
        run: npm run test:build
      - name: Resume PDF
        run: |
          npm run pdf
          npm run pdf:check
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  # Runs once the Cloudflare secrets and the DEPLOY_ENABLED variable are set (DEPLOY.md).
  deploy:
    needs: verify
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Deploy to production
        if: github.event_name == 'push'
        run: npx wrangler deploy
      - name: Preview link for this pull request
        if: github.event_name == 'pull_request'
        run: npx wrangler versions upload --preview-alias pr-${{ github.event.number }}
